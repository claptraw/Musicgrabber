services:
  music-grabber:
    build: .
    container_name: music-grabber
    restart: unless-stopped
    # Chromium needs more shared memory for headless browser - spotify over 100 tracks WILL fail without this
    shm_size: '2gb'
    ports:
      - "38274:8080"
    volumes:
      # Mount your music library - adjust path as needed
      - /mnt/music:/music
      # Persist the job database
      - ./data:/data
      # slskd downloads directory for Soulseek integration
      - /mnt/goodies/Downloads/slskd:/downloads
    environment:
      # Music directory inside container
      - MUSIC_DIR=/music
      # Database path
      - DB_PATH=/data/music_grabber.db
      # Enable MusicBrainz metadata lookup (true/false)
      - ENABLE_MUSICBRAINZ=true
      # Default FLAC conversion setting in the UI (true/false)
      - DEFAULT_CONVERT_TO_FLAC=true
      # slskd/Soulseek integration
      - SLSKD_URL=http://192.168.122.109:5030
      - SLSKD_USER=karl
      - SLSKD_PASS=k
      - SLSKD_DOWNLOADS_PATH=/downloads
      # Optional: Navidrome API for auto-rescan
      # - NAVIDROME_URL=https://navidrome.URL.com
      # - NAVIDROME_USER=username
      # - NAVIDROME_PASS=NavidromePassword!
      # Optional: Jellyfin API for auto-rescan
      # - JELLYFIN_URL=http://jellyfin:8096
      # - JELLYFIN_API_KEY=your-jellyfin-api-key
      # Optional: Notifications (triggers apply to all channels)
      # - NOTIFY_ON=playlists,bulk,errors  # Options: singles,playlists,bulk,errors
      # Telegram
      # - TELEGRAM_WEBHOOK_URL=https://api.telegram.org/bot{token}/sendMessage?chat_id={chat_id}
      # Email (SMTP)
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=user@example.com
      # - SMTP_PASS=password
      # - SMTP_FROM=musicgrabber@example.com
      # - SMTP_TO=you@example.com
      # - SMTP_TLS=true
    # Optional: add to your existing network if running with Navidrome
    # networks:
    #   - your-network
