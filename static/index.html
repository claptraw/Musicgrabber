<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Grabber</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1c1c1f;
            --text-primary: #f5f5f5;
            --text-secondary: #888;
            --accent: #22c55e;
            --accent-dim: #166534;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #2a2a2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .search-box {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 100px;
            font-size: 16px;
            font-family: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-history {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 50;
            display: none;
        }

        .search-history.show {
            display: block;
        }

        .history-item {
            padding: 12px 16px;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: var(--bg-tertiary);
        }

        .related-suggestions {
            margin-top: 16px;
            margin-bottom: 20px;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .related-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-chip {
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            padding: 10px 20px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .search-btn:hover {
            background: #16a34a;
        }

        .search-btn:active {
            transform: translateY(-50%) scale(0.98);
        }

        .search-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 8px 16px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .tab:hover:not(.active) {
            color: var(--text-primary);
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            display: flex;
            gap: 14px;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .result-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
        }

        .result-item:active {
            transform: scale(0.99);
        }

        .result-item.downloading {
            border-color: var(--warning);
            opacity: 0.7;
            pointer-events: none;
        }

        .result-item.previewing {
            border-color: var(--accent);
            background: var(--bg-tertiary);
        }

        .result-item.loading-preview {
            border-color: var(--text-secondary);
        }

        .preview-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .result-item.previewing .preview-indicator {
            opacity: 1;
            animation: pulse 1s infinite;
        }

        .result-item {
            position: relative;
        }

        .result-thumb {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--bg-tertiary);
            flex-shrink: 0;
        }

        .result-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-meta {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-duration {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 4px;
            align-self: flex-start;
        }

        .job-item {
            display: flex;
            gap: 14px;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .job-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 6px;
        }

        .job-status.queued { background: var(--warning); }
        .job-status.downloading { 
            background: var(--warning);
            animation: pulse 1s infinite;
        }
        .job-status.completed { background: var(--accent); }
        .job-status.failed { background: var(--error); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .job-info {
            flex: 1;
            min-width: 0;
        }

        .job-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .job-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .job-error {
            font-size: 12px;
            color: var(--error);
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 24px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            border-radius: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: var(--error);
            color: #fff;
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .clear-btn {
            padding: 8px 16px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            color: var(--error);
            border-color: var(--error);
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        .clear-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .bulk-textarea {
            width: 100%;
            min-height: 200px;
            max-height: 400px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .bulk-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .bulk-textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .file-upload {
            display: inline-block;
            padding: 10px 20px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-upload:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            transition: 0.3s;
            border-radius: 20px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: var(--text-secondary);
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--accent-dim);
            border-color: var(--accent);
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(16px);
            background-color: var(--accent);
        }

        @media (max-width: 400px) {
            .container {
                padding: 16px;
            }

            .result-thumb {
                width: 56px;
                height: 56px;
            }

            .result-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵</div>
            <h1>Music Grabber</h1>
            <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer;" title="When enabled, converts all downloads to FLAC format. When disabled, keeps the original format (usually opus/m4a).">
                    <span>FLAC</span>
                    <div class="toggle-switch" id="flacToggle">
                        <input type="checkbox" id="convertToFlac" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </label>
                <span style="font-size: 11px; color: var(--text-secondary);">v1.3.0</span>
            </div>
        </header>

        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search for a song..."
                autocomplete="off"
                autocapitalize="off"
            >
            <button class="search-btn" id="searchBtn">Search</button>
            <div class="search-history" id="searchHistory"></div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="results">Results</button>
            <button class="tab" data-tab="bulk">Bulk Import</button>
            <button class="tab" data-tab="queue">Queue</button>
        </div>

        <div id="relatedSuggestions" style="display: none;"></div>
        <div id="resultsTab" class="results"></div>

        <div id="bulkTabContainer" style="display: none;">
            <div style="margin-bottom: 12px;">
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">
                    Upload a text file or paste your song list below (one per line in format: Artist - Song Title). Maximum 70 songs.
                </p>
                <div style="margin-bottom: 12px;">
                    <label class="file-upload">
                        <input type="file" id="fileUpload" accept=".txt">
                        📁 Choose File
                    </label>
                    <span id="fileName" style="margin-left: 12px; font-size: 13px; color: var(--text-secondary);"></span>
                </div>
                <div style="position: relative;">
                    <textarea
                        id="bulkInput"
                        placeholder="ABBA – Dancing Queen&#10;ABBA – Super Trouper&#10;Backstreet Boys – I Want It That Way"
                        class="bulk-textarea"
                        maxlength="7000"
                    ></textarea>
                    <div id="lineCounter" style="position: absolute; bottom: 8px; right: 12px; font-size: 11px; color: var(--text-secondary); background: var(--bg-tertiary); padding: 4px 8px; border-radius: 4px;">0/70 lines</div>
                </div>
                <div style="margin-top: 12px; margin-bottom: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-primary); cursor: pointer;">
                        <input type="checkbox" id="createPlaylistCheckbox" style="width: 16px; height: 16px; cursor: pointer;">
                        <span>Create M3U playlist from these songs</span>
                    </label>
                    <input
                        type="text"
                        id="playlistNameInput"
                        placeholder="Playlist name (e.g., My Mixtape 2026)"
                        style="width: 100%; margin-top: 8px; padding: 10px 14px; font-size: 13px; font-family: inherit; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); display: none;"
                    >
                </div>
                <button
                    id="bulkImportBtn"
                    style="width: 100%; padding: 14px; font-size: 14px; font-family: inherit; font-weight: 600; background: var(--accent); color: #000; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s;"
                >
                    Import & Download All
                </button>
            </div>
            <div id="bulkResults" class="results"></div>
        </div>

        <div id="queueTabContainer" style="display: none;">
            <div class="queue-header">
                <h2 style="font-size: 14px; font-weight: 600; color: var(--text-secondary);">Download Queue</h2>
                <button class="clear-btn" id="clearQueueBtn">Clear Queue</button>
            </div>
            <div id="queueTab" class="results"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <audio id="previewAudio" preload="none"></audio>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchHistory = document.getElementById('searchHistory');
        const relatedSuggestions = document.getElementById('relatedSuggestions');
        const resultsTab = document.getElementById('resultsTab');
        const bulkTabContainer = document.getElementById('bulkTabContainer');
        const bulkInput = document.getElementById('bulkInput');
        const bulkImportBtn = document.getElementById('bulkImportBtn');
        const bulkResults = document.getElementById('bulkResults');
        const fileUpload = document.getElementById('fileUpload');
        const fileName = document.getElementById('fileName');
        const queueTabContainer = document.getElementById('queueTabContainer');
        const queueTab = document.getElementById('queueTab');
        const clearQueueBtn = document.getElementById('clearQueueBtn');
        const toast = document.getElementById('toast');
        const tabs = document.querySelectorAll('.tab');
        const lineCounter = document.getElementById('lineCounter');
        const createPlaylistCheckbox = document.getElementById('createPlaylistCheckbox');
        const playlistNameInput = document.getElementById('playlistNameInput');
        const convertToFlacCheckbox = document.getElementById('convertToFlac');

        // Load FLAC preference from localStorage
        const savedFlacPref = localStorage.getItem('convertToFlac');
        if (savedFlacPref !== null) {
            convertToFlacCheckbox.checked = savedFlacPref === 'true';
        }

        // Save FLAC preference when changed
        convertToFlacCheckbox.addEventListener('change', () => {
            localStorage.setItem('convertToFlac', convertToFlacCheckbox.checked);
        });

        let currentTab = 'results';
        let downloadingIds = new Set();
        let lastResults = [];
        const MAX_QUEUE_SIZE = 100;
        const MAX_BULK_LINES = 70;

        // Preview state
        const previewAudio = document.getElementById('previewAudio');
        let hoverTimeout = null;
        let currentPreviewId = null;
        let previewCache = new Map(); // Cache preview URLs
        const HOVER_DELAY = 2000; // 3 seconds before preview starts

        // Preview functions
        function startHoverTimer(videoId, element) {
            clearHoverTimer();
            hoverTimeout = setTimeout(() => {
                startPreview(videoId, element);
            }, HOVER_DELAY);
        }

        function clearHoverTimer() {
            if (hoverTimeout) {
                clearTimeout(hoverTimeout);
                hoverTimeout = null;
            }
        }

        async function startPreview(videoId, element) {
            // Don't preview if already downloading
            if (downloadingIds.has(videoId)) return;

            // Stop any current preview
            stopPreview();

            element.classList.add('loading-preview');

            try {
                let audioUrl = previewCache.get(videoId);

                if (!audioUrl) {
                    // Fetch preview URL from backend
                    const response = await fetch(`/api/preview/${videoId}`);
                    if (!response.ok) throw new Error('Failed to get preview');

                    const data = await response.json();
                    audioUrl = data.url;
                    previewCache.set(videoId, audioUrl);
                }

                element.classList.remove('loading-preview');
                element.classList.add('previewing');
                currentPreviewId = videoId;

                previewAudio.src = audioUrl;
                previewAudio.volume = 0.5;
                previewAudio.play().catch(() => {
                    // Autoplay blocked or other error
                    stopPreview();
                });

            } catch (error) {
                element.classList.remove('loading-preview');
                // Silently fail - preview is a nice-to-have
            }
        }

        function stopPreview() {
            clearHoverTimer();
            previewAudio.pause();
            previewAudio.src = '';
            currentPreviewId = null;

            // Remove previewing class from all items
            document.querySelectorAll('.result-item.previewing').forEach(item => {
                item.classList.remove('previewing');
            });
            document.querySelectorAll('.result-item.loading-preview').forEach(item => {
                item.classList.remove('loading-preview');
            });
        }

        // Search history management
        function getSearchHistory() {
            const history = localStorage.getItem('searchHistory');
            return history ? JSON.parse(history) : [];
        }

        function saveSearchHistory(query) {
            let history = getSearchHistory();
            // Remove duplicates
            history = history.filter(q => q !== query);
            // Add to front
            history.unshift(query);
            // Keep last 10
            history = history.slice(0, 10);
            localStorage.setItem('searchHistory', JSON.stringify(history));
        }

        function showSearchHistory() {
            const history = getSearchHistory();
            if (history.length === 0) {
                searchHistory.classList.remove('show');
                return;
            }

            searchHistory.innerHTML = history.map(q => `
                <div class="history-item" data-query="${escapeHtml(q)}">
                    ${escapeHtml(q)}
                </div>
            `).join('');

            searchHistory.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    searchInput.value = item.dataset.query;
                    searchHistory.classList.remove('show');
                    search();
                });
            });

            searchHistory.classList.add('show');
        }

        function hideSearchHistory() {
            setTimeout(() => {
                searchHistory.classList.remove('show');
            }, 200);
        }

        // Tab switching
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;

                resultsTab.style.display = currentTab === 'results' ? 'flex' : 'none';
                bulkTabContainer.style.display = currentTab === 'bulk' ? 'block' : 'none';
                queueTabContainer.style.display = currentTab === 'queue' ? 'block' : 'none';

                // Stop preview when leaving results tab
                if (currentTab !== 'results') {
                    stopPreview();
                }

                if (currentTab === 'queue') {
                    loadJobs();
                }
            });
        });

        // Search
        async function search() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Save to history
            saveSearchHistory(query);
            hideSearchHistory();

            searchBtn.disabled = true;
            resultsTab.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            relatedSuggestions.style.display = 'none';
            stopPreview(); // Stop any playing preview

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, limit: 15 })
                });

                if (!response.ok) throw new Error('Search failed');

                const data = await response.json();
                lastResults = data.results;
                renderResults(data.results);
                showRelatedSuggestions(data.results);
            } catch (error) {
                resultsTab.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">😕</div>
                        <p>Search failed. Try again.</p>
                    </div>
                `;
                showToast('Search failed', true);
            } finally {
                searchBtn.disabled = false;
            }
        }

        // Show related search suggestions based on artists
        function showRelatedSuggestions(results) {
            if (!results || results.length === 0) return;

            // Extract unique artists/channels
            const artists = [...new Set(results.map(r => r.channel))].slice(0, 5);

            if (artists.length === 0) return;

            relatedSuggestions.innerHTML = `
                <div class="related-suggestions">
                    <div class="related-title">Related searches</div>
                    <div class="suggestion-chips">
                        ${artists.map(artist => `
                            <button class="suggestion-chip" data-query="${escapeHtml(artist)}">
                                ${escapeHtml(artist)}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            relatedSuggestions.querySelectorAll('.suggestion-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    searchInput.value = chip.dataset.query;
                    search();
                });
            });

            relatedSuggestions.style.display = 'block';
        }

        function renderResults(results) {
            if (!results.length) {
                resultsTab.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>No results found</p>
                    </div>
                `;
                return;
            }

            resultsTab.innerHTML = results.map(r => `
                <div class="result-item ${downloadingIds.has(r.video_id) ? 'downloading' : ''}"
                     data-video-id="${r.video_id}"
                     data-title="${escapeHtml(r.title)}">
                    <div class="preview-indicator">▶</div>
                    <img class="result-thumb" src="${r.thumbnail}" alt="" loading="lazy">
                    <div class="result-info">
                        <div class="result-title">${escapeHtml(r.title)}</div>
                        <div class="result-meta">${escapeHtml(r.channel)}</div>
                        <div class="result-duration">${r.duration}</div>
                    </div>
                </div>
            `).join('');

            // Add click and hover handlers
            resultsTab.querySelectorAll('.result-item').forEach(item => {
                const videoId = item.dataset.videoId;
                const title = item.dataset.title;

                // Click to download
                item.addEventListener('click', () => {
                    if (!downloadingIds.has(videoId)) {
                        stopPreview();
                        downloadTrack(videoId, title, item);
                    }
                });

                // Hover to preview (desktop only)
                item.addEventListener('mouseenter', () => {
                    if (!downloadingIds.has(videoId)) {
                        startHoverTimer(videoId, item);
                    }
                });

                item.addEventListener('mouseleave', () => {
                    stopPreview();
                });
            });
        }

        async function downloadTrack(videoId, title, element) {
            // Check queue size limit
            const queueSize = await getQueueSize();
            if (queueSize >= MAX_QUEUE_SIZE) {
                showToast(`Queue limit reached (max ${MAX_QUEUE_SIZE})`, true);
                return;
            }

            downloadingIds.add(videoId);
            element.classList.add('downloading');

            // Show processing state immediately
            showToast('Processing...', false);

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_id: videoId,
                        title,
                        convert_to_flac: convertToFlacCheckbox.checked
                    })
                });

                if (!response.ok) throw new Error('Download failed');

                const data = await response.json();

                // Update toast with success message
                const formatMsg = convertToFlacCheckbox.checked ? '' : ' (original format)';
                showToast('Added to queue ✓' + formatMsg);
            } catch (error) {
                downloadingIds.delete(videoId);
                element.classList.remove('downloading');
                showToast('Failed to queue', true);
            }
        }

        async function getQueueSize() {
            try {
                const response = await fetch('/api/jobs?limit=100');
                if (!response.ok) return 0;
                const data = await response.json();
                // Count queued and downloading jobs
                return data.jobs.filter(j => j.status === 'queued' || j.status === 'downloading').length;
            } catch (error) {
                return 0;
            }
        }

        async function loadJobs(showLoading = true) {
            if (showLoading) {
                queueTab.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            }

            try {
                const response = await fetch('/api/jobs?limit=30');
                if (!response.ok) throw new Error('Failed to load jobs');

                const data = await response.json();
                renderJobs(data.jobs);
            } catch (error) {
                if (showLoading) {
                    queueTab.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">😕</div>
                            <p>Failed to load queue</p>
                        </div>
                    `;
                }
            }
        }

        function renderJobs(jobs) {
            if (!jobs.length) {
                queueTab.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No downloads yet</p>
                    </div>
                `;
                return;
            }

            queueTab.innerHTML = jobs.map(job => `
                <div class="job-item" data-job-id="${job.id}">
                    <div class="job-status ${job.status}"></div>
                    <div class="job-info">
                        <div class="job-title">${escapeHtml(job.artist ? `${job.artist} - ${job.title}` : job.title)}</div>
                        <div class="job-meta">${job.status} • ${formatTime(job.created_at)}</div>
                        ${job.error ? `<div class="job-error">${escapeHtml(job.error)}</div>` : ''}
                    </div>
                </div>
            `).join('');

            // If there are active jobs, poll for updates
            const hasActive = jobs.some(j => j.status === 'queued' || j.status === 'downloading');
            if (hasActive && currentTab === 'queue') {
                setTimeout(() => loadJobs(false), 3000);
            }
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return 'just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return date.toLocaleDateString();
        }

        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function bulkImport() {
            const songs = bulkInput.value.trim();
            if (!songs) {
                showToast('Please enter some songs', true);
                return;
            }

            const songLines = songs.split('\n').filter(line => line.trim());

            // Check line limit
            if (songLines.length > MAX_BULK_LINES) {
                showToast(`Maximum ${MAX_BULK_LINES} songs allowed`, true);
                return;
            }

            // Check queue size limit
            const queueSize = await getQueueSize();
            if (queueSize + songLines.length > MAX_QUEUE_SIZE) {
                showToast(`Queue limit would be exceeded (max ${MAX_QUEUE_SIZE})`, true);
                return;
            }

            // Validate playlist name if checkbox is checked
            const createPlaylist = createPlaylistCheckbox.checked;
            const playlistName = playlistNameInput.value.trim();

            if (createPlaylist && !playlistName) {
                showToast('Please enter a playlist name', true);
                playlistNameInput.focus();
                return;
            }

            bulkImportBtn.disabled = true;
            bulkImportBtn.textContent = 'Processing...';
            bulkResults.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const requestBody = {
                    songs,
                    convert_to_flac: convertToFlacCheckbox.checked
                };
                if (createPlaylist) {
                    requestBody.create_playlist = true;
                    requestBody.playlist_name = playlistName;
                }

                const response = await fetch('/api/bulk-import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) throw new Error('Bulk import failed');

                const data = await response.json();

                // Show results
                let html = `
                    <div style="padding: 14px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Import Summary</div>
                        <div style="font-size: 13px; color: var(--text-secondary);">
                            ✓ ${data.queued} songs queued<br>
                            ${data.failed > 0 ? `✗ ${data.failed} songs failed` : ''}
                        </div>
                    </div>
                `;

                if (data.failures.length > 0) {
                    html += `
                        <div style="padding: 14px; background: var(--bg-secondary); border: 1px solid var(--error); border-radius: 12px;">
                            <div style="font-size: 14px; font-weight: 600; color: var(--error); margin-bottom: 8px;">Failed Lines</div>
                            ${data.failures.map(f => `
                                <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">
                                    Line ${f.line}: ${escapeHtml(f.text)}<br>
                                    <span style="color: var(--error);">→ ${escapeHtml(f.reason)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                bulkResults.innerHTML = html;

                if (createPlaylist) {
                    showToast(`Queued ${data.queued} song(s) - Playlist will be created`);
                } else {
                    showToast(`Queued ${data.queued} song(s)`);
                }

                // Clear the textarea and inputs
                bulkInput.value = '';
                playlistNameInput.value = '';
                createPlaylistCheckbox.checked = false;
                playlistNameInput.style.display = 'none';
                updateLineCounter();
            } catch (error) {
                bulkResults.innerHTML = '';
                showToast('Bulk import failed', true);
            } finally {
                bulkImportBtn.disabled = false;
                bulkImportBtn.textContent = 'Import & Download All';
            }
        }

        async function clearQueue() {
            if (!confirm('Clear all completed and failed downloads from the queue?')) {
                return;
            }

            clearQueueBtn.disabled = true;

            try {
                const response = await fetch('/api/jobs/cleanup', {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to clear queue');

                const data = await response.json();
                showToast(`Cleared ${data.deleted} job(s)`);
                loadJobs();
            } catch (error) {
                showToast('Failed to clear queue', true);
            } finally {
                clearQueueBtn.disabled = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Line counter and limit enforcement
        function updateLineCounter() {
            const lines = bulkInput.value.split('\n').filter(line => line.trim());
            const count = lines.length;
            lineCounter.textContent = `${count}/${MAX_BULK_LINES} lines`;

            if (count > MAX_BULK_LINES) {
                lineCounter.style.color = 'var(--error)';
                lineCounter.style.background = 'var(--bg-secondary)';
            } else {
                lineCounter.style.color = 'var(--text-secondary)';
                lineCounter.style.background = 'var(--bg-tertiary)';
            }
        }

        function limitLines(text) {
            const lines = text.split('\n');
            if (lines.length > MAX_BULK_LINES) {
                return lines.slice(0, MAX_BULK_LINES).join('\n');
            }
            return text;
        }

        bulkInput.addEventListener('input', updateLineCounter);

        bulkInput.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedText = (e.clipboardData || window.clipboardData).getData('text');
            const limitedText = limitLines(pastedText);

            // Insert at cursor position
            const start = bulkInput.selectionStart;
            const end = bulkInput.selectionEnd;
            const currentValue = bulkInput.value;
            const newValue = currentValue.substring(0, start) + limitedText + currentValue.substring(end);

            bulkInput.value = limitLines(newValue);
            updateLineCounter();

            if (pastedText.split('\n').length > MAX_BULK_LINES) {
                showToast(`Content limited to ${MAX_BULK_LINES} lines`, true);
            }
        });

        // File upload handler
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            fileName.textContent = file.name;

            const reader = new FileReader();
            reader.onload = (event) => {
                const content = event.target.result;
                bulkInput.value = limitLines(content);
                updateLineCounter();

                if (content.split('\n').length > MAX_BULK_LINES) {
                    showToast(`File content limited to ${MAX_BULK_LINES} lines`, true);
                }
            };
            reader.readAsText(file);
        });

        // Event listeners
        searchBtn.addEventListener('click', search);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                search();
            }
        });
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim() === '') {
                showSearchHistory();
            }
        });
        searchInput.addEventListener('blur', hideSearchHistory);
        searchInput.addEventListener('input', () => {
            if (searchInput.value.trim() === '') {
                showSearchHistory();
            } else {
                hideSearchHistory();
            }
        });
        bulkImportBtn.addEventListener('click', bulkImport);
        clearQueueBtn.addEventListener('click', clearQueue);

        // Show/hide playlist name input when checkbox is toggled
        createPlaylistCheckbox.addEventListener('change', () => {
            playlistNameInput.style.display = createPlaylistCheckbox.checked ? 'block' : 'none';
            if (createPlaylistCheckbox.checked) {
                playlistNameInput.focus();
            }
        });

        // Close search history when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchHistory.contains(e.target)) {
                searchHistory.classList.remove('show');
            }
        });

        // Initial empty state
        resultsTab.innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🎧</div>
                <p>Search for music to get started</p>
                <p style="font-size: 12px; margin-top: 8px; opacity: 0.6;">Hover over results to preview</p>
            </div>
        `;
    </script>
</body>
</html>
